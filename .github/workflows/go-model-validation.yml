  own-model-sdk-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/checkout@v7
        with:
          repository: kimjooyoon/gooo-decision-runtime
          ref: 2a730c83f1a43f303fe526801890571cc87e9fcb
          path: .own-model-sdk
          persist-credentials: false
      - name: Build pinned Go context example and check its contracts
        run: |
          (cd .own-model-sdk && go test -race ./... && go build -trimpath -o "$RUNNER_TEMP/gooo-sdk-path" ./examples/gooo-path)
      - name: Execute explicit own models and disconnected typed bodies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/own-model-sdk-context"
          for task_language in en ko; do
            for task_contract in sparse full; do
              for task_variant in fp32 ptq_ternary qat_ternary offline; do
                task_args=()
                task_calls=0
                if [ "$task_variant" != offline ]; then
                  task_args=(--model "runs/split-context-judgment-mps-20261001/v2/models/$task_variant/model.json")
                  task_calls=1
                fi
                task_capture="$RUNNER_TEMP/own-model-sdk-context/$task_language-$task_contract-$task_variant.json"
                "$RUNNER_TEMP/gooo-sdk-path" --plan "studies/own-model-sdk-context-v1/$task_language-$task_contract.json" "${task_args[@]}" > "$task_capture"
                jq -e --argjson calls "$task_calls" '.search.selection.local_model_predictions==$calls and .native_compiler_calls==0 and .emitted_go_processes==0 and .search.selected_training_passed==.search.training_cases' "$task_capture"
                if [ "$task_contract" = full ]; then
                  jq -e '.gooo_body=="return (input - 2)" and .search.training_cases==2' "$task_capture"
                fi
              done
            done
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: own-model-sdk-context
          path: ${{ runner.temp }}/own-model-sdk-context
          if-no-files-found: error

  compiler-model-dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/checkout@v7
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: 68361e64def5457f0d0e6de972570a9885cceb96
          path: .native-tiny
          persist-credentials: false
      - name: Build the clean native compiler and Go dogfood runner
        run: |
          (cd .native-tiny && go build -trimpath -o "$RUNNER_TEMP/gooo-native-tiny" ./cmd/gooo)
          go build -trimpath -o "$RUNNER_TEMP/compiler-dogfood" ./tools/compiler-dogfood
      - name: Execute six local model cells and two disconnected cells
        run: |
          task_go_bin=$(command -v go)
          "$RUNNER_TEMP/compiler-dogfood" --compiler "$RUNNER_TEMP/gooo-native-tiny" --compiler-dir "$GITHUB_WORKSPACE/.native-tiny" --go "$task_go_bin" --models runs/compiler-prov-v3-mps-20261001/models --output "$RUNNER_TEMP/compiler-dogfood-model"
          "$RUNNER_TEMP/compiler-dogfood" --compiler "$RUNNER_TEMP/gooo-native-tiny" --compiler-dir "$GITHUB_WORKSPACE/.native-tiny" --go "$task_go_bin" --output "$RUNNER_TEMP/compiler-dogfood-offline"
      - name: Replay saved bilingual structural paths through native codegen and Go
        run: |
          task_go_bin=$(command -v go)
          task_go_sha=$(sha256sum "$task_go_bin" | cut -d ' ' -f 1)
          task_native_sha=$(sha256sum "$RUNNER_TEMP/gooo-native-tiny" | cut -d ' ' -f 1)
          go run ./tools/replay-path-probe --compiler "$RUNNER_TEMP/gooo-native-tiny" --compiler-sha "$task_native_sha" --go "$task_go_bin" --go-sha "$task_go_sha" --output "$RUNNER_TEMP/path-native-replay" --source-revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compiler-model-dogfood
          path: |
            ${{ runner.temp }}/compiler-dogfood-model
            ${{ runner.temp }}/compiler-dogfood-offline
            ${{ runner.temp }}/path-native-replay
          if-no-files-found: error

  native-typed-structural-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/checkout@v7
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: d21ce275ec0832e38ad4962ad03f4546c1b46e9f
          path: .native-paths
          persist-credentials: false
      - name: Build source-bound native compiler and observation runner
        run: |
          (cd .native-paths && go build -trimpath -o "$RUNNER_TEMP/gooo-native-paths" ./cmd/gooo)
          go build -trimpath -o "$RUNNER_TEMP/audit-native-paths" ./tools/audit-native-paths
      - name: Observe fresh predictions and independently execute exact emitted Go
        run: |
          task_go_bin=$(command -v go)
          task_go_sha=$(sha256sum "$task_go_bin" | cut -d ' ' -f 1)
          task_native_sha=$(sha256sum "$RUNNER_TEMP/gooo-native-paths" | cut -d ' ' -f 1)
          "$RUNNER_TEMP/audit-native-paths" --compiler "$RUNNER_TEMP/gooo-native-paths" \
            --compiler-sha "$task_native_sha" --go "$task_go_bin" --go-sha "$task_go_sha" \
            --fixtures "$GITHUB_WORKSPACE/.native-paths/examples/body-codegen" \
            --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/native-path-observation"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-typed-structural-inference
          path: ${{ runner.temp }}/native-path-observation
          if-no-files-found: error

  native-body-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/checkout@v7
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: 60cf7f49b0e302a6bebb42bc8da90f3ed19b2b82
          path: .native-gooo
          persist-credentials: false
      - name: Build pinned native compiler and Go evaluation runner
        run: |
          (cd .native-gooo && go build -trimpath -o "$RUNNER_TEMP/gooo-native" ./cmd/gooo)
          go build -trimpath -o "$RUNNER_TEMP/body-plan-evaluate" ./tools/evaluate-bodyplans
      - name: Execute all model-free and tiny-model body arms
        run: |
          task_go_bin=$(command -v go)
          task_go_sha=$(sha256sum "$task_go_bin" | cut -d ' ' -f 1)
          task_gooo_sha=$(sha256sum "$RUNNER_TEMP/gooo-native" | cut -d ' ' -f 1)
          task_cohort_sha=$(sha256sum studies/body-plan-v1/cohort.jsonl | cut -d ' ' -f 1)
          "$RUNNER_TEMP/body-plan-evaluate" \
            --source-revision "$GITHUB_SHA" --cohort-sha256 "$task_cohort_sha" \
            --gooo-bin "$RUNNER_TEMP/gooo-native" --gooo-sha256 "$task_gooo_sha" \
            --go-bin "$task_go_bin" --go-sha256 "$task_go_sha" \
            --output-dir "$RUNNER_TEMP/body-plan-native-study"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-body-plan-evaluation
          path: ${{ runner.temp }}/body-plan-native-study
          if-no-files-found: error
