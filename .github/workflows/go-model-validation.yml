name: Go model validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-choice-source-teacher-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify all public source and teacher bytes without model inference
        run: |
          go run ./tools/package-three-curriculum --mode verify \
            --bundle publication/own-three-choice-curriculum-20261002.zip \
            --manifest publication/own-three-choice-curriculum-bundle-20261002.json \
            --destination "$RUNNER_TEMP/three-choice-frozen"
          cmp docs/own-three-choice-completeness-preregistration-20261002.md "$RUNNER_TEMP/three-choice-frozen/protocol.md"
          cmp models/joint-composition-v1/independent/models/fp32/model.json "$RUNNER_TEMP/three-choice-frozen/reference-models/independent/model.json"
          cmp models/joint-composition-v1/independent/models/fp32/weights.bin "$RUNNER_TEMP/three-choice-frozen/reference-models/independent/weights.bin"
      - name: Independently reconcile complete native exports and actual teacher frontiers
        run: |
          go run ./tools/three-composition-curriculum \
            --audit "$RUNNER_TEMP/three-choice-frozen/own-three-composition-curriculum-fixed-20261002" \
            --audit-report "$RUNNER_TEMP/three-choice-source-audit.json"
          go run ./tools/collect-own-three-feedback \
            --dataset "$RUNNER_TEMP/three-choice-frozen/own-three-composition-curriculum-fixed-20261002/dataset.jsonl" \
            --output "$RUNNER_TEMP/three-choice-frozen/own-three-teacher-curriculum-20261002" \
            --audit-report "$RUNNER_TEMP/three-choice-teacher-audit.json"
          cmp publication/own-three-choice-curriculum-audit-20261002.json "$RUNNER_TEMP/three-choice-source-audit.json"
          cmp publication/own-three-choice-teacher-audit-20261002.json "$RUNNER_TEMP/three-choice-teacher-audit.json"
      - name: Recompute balanced optimizer inputs and a new common initializer in Go
        run: |
          mkdir -p runs
          mv "$RUNNER_TEMP/three-choice-frozen/own-three-composition-curriculum-20261002" runs/
          mv "$RUNNER_TEMP/three-choice-frozen/own-three-composition-curriculum-fixed-20261002" runs/
          mv "$RUNNER_TEMP/three-choice-frozen/own-three-teacher-curriculum-20261002" runs/
          go run ./tools/prepare-own-three-training \
            --dataset runs/own-three-composition-curriculum-fixed-20261002/dataset.jsonl \
            --teacher-curriculum runs/own-three-teacher-curriculum-20261002 \
            --output runs/own-three-training-inputs-ci \
            --source-revision "$GITHUB_SHA"
          go run ./tools/prepare-own-three-training \
            --dataset runs/own-three-composition-curriculum-fixed-20261002/dataset.jsonl \
            --teacher-curriculum runs/own-three-teacher-curriculum-20261002 \
            --output runs/own-three-training-inputs-ci \
            --verify-report "$RUNNER_TEMP/three-choice-training-input-audit.json" \
            --source-revision "$GITHUB_SHA"
      - name: Verify every trained model, prepared feature and optimizer receipt
        run: |
          go run ./tools/package-three-training --mode verify \
            --bundle publication/own-three-choice-training-20261002.zip \
            --manifest publication/own-three-choice-training-bundle-20261002.json \
            --destination "$RUNNER_TEMP/three-choice-training"
          mv runs/own-three-composition-curriculum-20261002 "$RUNNER_TEMP/three-choice-training/"
          mv runs/own-three-composition-curriculum-fixed-20261002 "$RUNNER_TEMP/three-choice-training/"
          mv runs/own-three-teacher-curriculum-20261002 "$RUNNER_TEMP/three-choice-training/"
          go run ./tools/prepare-own-three-training \
            --dataset "$RUNNER_TEMP/three-choice-training/own-three-composition-curriculum-fixed-20261002/dataset.jsonl" \
            --teacher-curriculum "$RUNNER_TEMP/three-choice-training/own-three-teacher-curriculum-20261002" \
            --output "$RUNNER_TEMP/three-choice-training/own-three-training-inputs-20261002" \
            --verify-report "$RUNNER_TEMP/three-choice-published-input-audit.json" \
            --source-revision "$GITHUB_SHA"
          go run ./tools/audit-own-three-models \
            --models "$RUNNER_TEMP/three-choice-training/own-three-training-mps-20261002" \
            --dataset "$RUNNER_TEMP/three-choice-training/own-three-composition-curriculum-fixed-20261002/dataset.jsonl" \
            --teacher-curriculum "$RUNNER_TEMP/three-choice-training/own-three-teacher-curriculum-20261002" \
            --output "$RUNNER_TEMP/three-choice-model-audit.json" \
            --source-revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: three-choice-source-teacher-independent-audits
          path: |
            ${{ runner.temp }}/three-choice-source-audit.json
            ${{ runner.temp }}/three-choice-teacher-audit.json
            ${{ runner.temp }}/three-choice-training-input-audit.json
            ${{ runner.temp }}/three-choice-published-input-audit.json
            ${{ runner.temp }}/three-choice-model-audit.json
          if-no-files-found: error
  own-joint-feedback-v2-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Fetch pinned public v2 bytes and stream verified raw evidence
        run: |
          go run ./tools/package-own-feedback --mode fetch \
            --public-revision b4e9a3e50b50e893abc52a36f49eacf032aded50 \
            --manifest-sha256 e6eb1babcd94ccd1a75fea5d76069a5dc0bbb368f57318cc4a2608019b4a16a5 \
            --bundle "$RUNNER_TEMP/feedback-public" \
            --evidence "$RUNNER_TEMP/feedback-frozen-evidence" \
            --output "$RUNNER_TEMP/feedback-public-verification.json"
          cmp docs/own-joint-completeness-feedback-preregistration-20261002.md "$RUNNER_TEMP/feedback-public/protocol.md"
          cmp models/own-joint-feedback-v2/report.json "$RUNNER_TEMP/feedback-public/training-report.json"
          cmp models/own-joint-feedback-v2/preexecution.json "$RUNNER_TEMP/feedback-public/training-preexecution.json"
          mkdir "$RUNNER_TEMP/feedback-public-models"
          cp "$RUNNER_TEMP/feedback-public/training-report.json" "$RUNNER_TEMP/feedback-public-models/report.json"
          cp "$RUNNER_TEMP/feedback-public/training-preexecution.json" "$RUNNER_TEMP/feedback-public-models/preexecution.json"
          for arm in uniform-initial set-initial set-feedback; do
            cp -R "$RUNNER_TEMP/feedback-public/$arm" "$RUNNER_TEMP/feedback-public-models/$arm"
            for variant in fp32 ptq_ternary qat_ternary; do
              for file in model.json weights.bin; do
                cmp "models/own-joint-feedback-v2/$arm/models/$variant/$file" "$RUNNER_TEMP/feedback-public-models/$arm/models/$variant/$file"
              done
            done
          done
          for arm in joint independent; do
            for file in model.json weights.bin; do
              cmp "models/joint-composition-v1/$arm/models/fp32/$file" "$RUNNER_TEMP/feedback-frozen-evidence/reference-models/$arm/$file"
            done
          done
      - name: Audit retained teacher, all-policy SDK and compiled native records without inference
        run: |
          go run ./tools/joint-composition-curriculum \
            --audit "$RUNNER_TEMP/feedback-frozen-evidence/original-curriculum" \
            --audit-report "$RUNNER_TEMP/feedback-source-curriculum-audit.json"
          go run ./tools/collect-own-joint-feedback \
            --dataset "$RUNNER_TEMP/feedback-frozen-evidence/original-curriculum/dataset.jsonl" \
            --output "$RUNNER_TEMP/feedback-frozen-evidence/teacher" \
            --audit-report "$RUNNER_TEMP/feedback-teacher-audit.json"
          go run ./tools/own-joint-feedback-study \
            --dataset "$RUNNER_TEMP/feedback-frozen-evidence/original-curriculum/dataset.jsonl" \
            --models "$RUNNER_TEMP/feedback-public-models" \
            --output "$RUNNER_TEMP/feedback-frozen-evidence/sdk" \
            --audit-report "$RUNNER_TEMP/feedback-sdk-frozen-audit.json"
          go run ./tools/own-joint-feedback-study --mode native \
            --dataset "$RUNNER_TEMP/feedback-frozen-evidence/original-curriculum/dataset.jsonl" \
            --models "$RUNNER_TEMP/feedback-public-models" \
            --sdk-study "$RUNNER_TEMP/feedback-frozen-evidence/sdk" \
            --output "$RUNNER_TEMP/feedback-frozen-evidence/native" \
            --audit-report "$RUNNER_TEMP/feedback-native-frozen-audit.json"
          go run ./tools/own-joint-feedback-study --mode native-metrics \
            --dataset "$RUNNER_TEMP/feedback-frozen-evidence/original-curriculum/dataset.jsonl" \
            --models "$RUNNER_TEMP/feedback-public-models" \
            --sdk-study "$RUNNER_TEMP/feedback-frozen-evidence/sdk" \
            --output "$RUNNER_TEMP/feedback-frozen-evidence/native" \
            --audit-report "$RUNNER_TEMP/feedback-native-frozen-process-summary.json"
          cmp publication/own-joint-feedback-native-process-metrics-20261002.json "$RUNNER_TEMP/feedback-native-frozen-process-summary.json"
      - name: Execute new Go parity probes and 9216 SDK sessions using public models
        run: |
          go run ./tools/audit-own-joint-feedback-models \
            --models "$RUNNER_TEMP/feedback-public-models" \
            --curriculum "$RUNNER_TEMP/feedback-frozen-evidence/teacher" \
            --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/feedback-new-go-model-audit.json"
          go run ./tools/own-joint-feedback-study \
            --dataset "$RUNNER_TEMP/feedback-frozen-evidence/original-curriculum/dataset.jsonl" \
            --models "$RUNNER_TEMP/feedback-public-models" \
            --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/feedback-sdk-new"
          go run ./tools/own-joint-feedback-study \
            --dataset "$RUNNER_TEMP/feedback-frozen-evidence/original-curriculum/dataset.jsonl" \
            --models "$RUNNER_TEMP/feedback-public-models" \
            --output "$RUNNER_TEMP/feedback-sdk-new" \
            --audit-report "$RUNNER_TEMP/feedback-sdk-new/independent-audit-strengthened.json"
      - name: Build the exact adopted compiler main
        run: |
          git clone --no-checkout https://github.com/kimjooyoon/meta-ontology-go.git "$RUNNER_TEMP/feedback-native-source"
          git -C "$RUNNER_TEMP/feedback-native-source" checkout --detach 363a3d8aa365c35dd634c241248b444de0050973
          cd "$RUNNER_TEMP/feedback-native-source"
          go build -trimpath -o "$RUNNER_TEMP/gooo-feedback" ./cmd/gooo
          go build -trimpath -o "$RUNNER_TEMP/gooo-body-worker" ./cmd/gooo-body-worker
      - name: Execute 240 new Gooo generations and 3840 independent Go invocations
        run: |
          go run ./tools/own-joint-feedback-study --mode native \
            --dataset "$RUNNER_TEMP/feedback-frozen-evidence/original-curriculum/dataset.jsonl" \
            --models "$RUNNER_TEMP/feedback-public-models" \
            --sdk-study "$RUNNER_TEMP/feedback-sdk-new" --output "$RUNNER_TEMP/feedback-native-new" \
            --source-revision "$GITHUB_SHA" --native "$RUNNER_TEMP/gooo-feedback" --go-bin "$(command -v go)"
          go run ./tools/own-joint-feedback-study --mode native \
            --dataset "$RUNNER_TEMP/feedback-frozen-evidence/original-curriculum/dataset.jsonl" \
            --models "$RUNNER_TEMP/feedback-public-models" \
            --sdk-study "$RUNNER_TEMP/feedback-sdk-new" --output "$RUNNER_TEMP/feedback-native-new" \
            --audit-report "$RUNNER_TEMP/feedback-native-new/independent-audit.json"
          go run ./tools/own-joint-feedback-study --mode native-metrics \
            --dataset "$RUNNER_TEMP/feedback-frozen-evidence/original-curriculum/dataset.jsonl" \
            --models "$RUNNER_TEMP/feedback-public-models" \
            --sdk-study "$RUNNER_TEMP/feedback-sdk-new" --output "$RUNNER_TEMP/feedback-native-new" \
            --audit-report "$RUNNER_TEMP/feedback-native-new/process-summary.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: own-joint-feedback-v2-native
          retention-days: 7
          path: |
            ${{ runner.temp }}/feedback-native-new
            ${{ runner.temp }}/feedback-sdk-new
            ${{ runner.temp }}/feedback-public-verification.json
            ${{ runner.temp }}/feedback-source-curriculum-audit.json
            ${{ runner.temp }}/feedback-teacher-audit.json
            ${{ runner.temp }}/feedback-sdk-frozen-audit.json
            ${{ runner.temp }}/feedback-native-frozen-audit.json
            ${{ runner.temp }}/feedback-native-frozen-process-summary.json
            ${{ runner.temp }}/feedback-new-go-model-audit.json

  joint-own-model-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Retrieve and independently verify immutable public own-model evidence
        run: |
          go run ./tools/package-joint-composition --mode fetch \
            --bundle "$RUNNER_TEMP/joint-public-models" \
            --verify-revision 5fb63c8092b4f1a2b1d0eb99b6d17f42cd6aac66 \
            --manifest-sha256 6dd310035426da8c93e933c09174c6daa6e783eb79bbb8157bcf782cf6f5946a \
            --evidence "$RUNNER_TEMP/joint-frozen-evidence" \
            --output "$RUNNER_TEMP/joint-public-verification.json"
      - name: Reconstruct frozen source curriculum, SDK sessions and actual native values
        run: |
          go run ./tools/joint-composition-curriculum \
            --audit "$RUNNER_TEMP/joint-frozen-evidence/curriculum" \
            --audit-report "$RUNNER_TEMP/joint-curriculum-audit.json"
          go run ./tools/audit-joint-representation \
            --dataset "$RUNNER_TEMP/joint-frozen-evidence/curriculum/dataset.jsonl" \
            --output "$RUNNER_TEMP/joint-representation-diagnostic.json"
          cmp publication/joint-composition-representation-diagnostic-20261002.json \
            "$RUNNER_TEMP/joint-representation-diagnostic.json"
          go run ./tools/joint-composition-study \
            --curriculum "$RUNNER_TEMP/joint-frozen-evidence/curriculum" \
            --models models/joint-composition-v1 \
            --audit-study "$RUNNER_TEMP/joint-frozen-evidence/sdk" \
            --output "$RUNNER_TEMP/joint-sdk-audit.json"
          go run ./tools/joint-composition-study --mode native-audit \
            --curriculum "$RUNNER_TEMP/joint-frozen-evidence/curriculum" \
            --models models/joint-composition-v1 \
            --study "$RUNNER_TEMP/joint-frozen-evidence/sdk" \
            --native "$RUNNER_TEMP/joint-frozen-evidence/native" \
            --output "$RUNNER_TEMP/joint-frozen-native-audit.json"
      - name: Build the adopted Gooo main and body worker
        run: |
          git clone --no-checkout https://github.com/kimjooyoon/meta-ontology-go.git "$RUNNER_TEMP/joint-native-source"
          git -C "$RUNNER_TEMP/joint-native-source" checkout --detach 363a3d8aa365c35dd634c241248b444de0050973
          cd "$RUNNER_TEMP/joint-native-source"
          go build -trimpath -o "$RUNNER_TEMP/gooo-joint" ./cmd/gooo
          go build -trimpath -o "$RUNNER_TEMP/gooo-body-worker" ./cmd/gooo-body-worker
      - name: Perform new direct native generations and compiled-Go executions
        run: |
          go run ./tools/joint-composition-study --mode native \
            --curriculum "$RUNNER_TEMP/joint-frozen-evidence/curriculum" \
            --models models/joint-composition-v1 \
            --study "$RUNNER_TEMP/joint-frozen-evidence/sdk" \
            --output "$RUNNER_TEMP/joint-native-new" \
            --source-revision "$GITHUB_SHA" \
            --binary "$RUNNER_TEMP/gooo-joint" --go-binary "$(command -v go)"
          go run ./tools/joint-composition-study --mode native-audit \
            --curriculum "$RUNNER_TEMP/joint-frozen-evidence/curriculum" \
            --models models/joint-composition-v1 \
            --study "$RUNNER_TEMP/joint-frozen-evidence/sdk" \
            --native "$RUNNER_TEMP/joint-native-new" \
            --output "$RUNNER_TEMP/joint-native-new/independent-audit.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: joint-own-model-native
          path: |
            ${{ runner.temp }}/joint-native-new
            ${{ runner.temp }}/joint-public-verification.json
            ${{ runner.temp }}/joint-curriculum-audit.json
            ${{ runner.temp }}/joint-sdk-audit.json
            ${{ runner.temp }}/joint-frozen-native-audit.json

  runtime-and-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - name: Retrieve immutable paired publication source
        run: git fetch --depth=1 origin ed5d85f98e003824d75785cff69d2d3f26ae325a
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Require formatted Go
        run: test -z "$(gofmt -l cmd internal tools decision)"
      - name: Go vet
        run: go vet ./...
      - name: Runtime and publication regression tests
        run: go test -race ./...
      - name: Reproduce frozen synthetic data
        run: |
          go run ./cmd/dataset --out-dir "$RUNNER_TEMP/dataset-replay"
          cmp data/synthetic-ops-v1/dataset.jsonl "$RUNNER_TEMP/dataset-replay/dataset.jsonl"
          cmp data/synthetic-ops-v1/manifest.json "$RUNNER_TEMP/dataset-replay/manifest.json"
      - name: Reproduce frozen multi-node body cohort
        run: |
          go run ./studies/body-plan-v1 "$RUNNER_TEMP/body-plan-cohort"
          cmp studies/body-plan-v1/cohort.jsonl "$RUNNER_TEMP/body-plan-cohort/cohort.jsonl"
          cmp studies/body-plan-v1/manifest.json "$RUNNER_TEMP/body-plan-cohort/manifest.json"
      - name: Reproduce five-family native continuation cohort
        run: |
          go run ./tools/native-feedback-study --mode family-cohort --out "$RUNNER_TEMP/native-family-cohort"
          cmp studies/feedback-family-v1/cohort.jsonl "$RUNNER_TEMP/native-family-cohort/cohort.jsonl"
          cmp studies/feedback-family-v1/manifest.json "$RUNNER_TEMP/native-family-cohort/manifest.json"
      - name: Reproduce interacting four-path body cohort
        run: |
          go run ./tools/native-feedback-study --mode compound-cohort --out "$RUNNER_TEMP/compound-path-cohort"
          cmp studies/compound-path-v1/cohort.jsonl "$RUNNER_TEMP/compound-path-cohort/cohort.jsonl"
          cmp studies/compound-path-v1/manifest.json "$RUNNER_TEMP/compound-path-cohort/manifest.json"
      - name: Reproduce finite feedback targets with preserved ambiguity
        run: |
          go run ./cmd/feedback-curriculum --out "$RUNNER_TEMP/feedback-path-curriculum"
          cmp data/feedback-path-v1/dataset.jsonl "$RUNNER_TEMP/feedback-path-curriculum/dataset.jsonl"
          cmp data/feedback-path-v1/manifest.json "$RUNNER_TEMP/feedback-path-curriculum/manifest.json"
      - name: Verify feedback-trained model pairs and numerical parity
        run: |
          go run ./tools/audit-feedback-model --models runs/feedback-path-soft-target-mps-20261001/models \
            --output "$RUNNER_TEMP/feedback-path-model-audit.json"
      - name: Reproduce source-bound bilingual Gooo pairs
        run: |
          go run ./cmd/bilingual-pairs --out "$RUNNER_TEMP/bilingual-gooo-pairs"
          cmp data/bilingual-gooo-pairs-v1/pairs.jsonl "$RUNNER_TEMP/bilingual-gooo-pairs/pairs.jsonl"
          cmp data/bilingual-gooo-pairs-v1/manifest.json "$RUNNER_TEMP/bilingual-gooo-pairs/manifest.json"
      - name: Verify both bilingual judgment arms and finite continuation
        run: |
          go run ./tools/audit-feedback-model --models runs/bilingual-judgment-mps-20261001/control/models \
            --output "$RUNNER_TEMP/bilingual-control-go-parity.json"
          go run ./tools/audit-feedback-model --models runs/bilingual-judgment-mps-20261001/paired/models \
            --output "$RUNNER_TEMP/bilingual-paired-go-parity.json"
          go run ./tools/audit-bilingual-judgment --models runs/bilingual-judgment-mps-20261001 \
            --out "$RUNNER_TEMP/bilingual-go-judgment"
      - name: Reconcile captured bilingual main dogfood and publication
        run: |
          go run ./tools/native-feedback-study --mode bilingual-audit --out runs/bilingual-judgment-native-main-20261001 \
            --source-revision 90dbefe731cb95a65798ef6d380f22cfd811b5ca \
            --native-revision 1e01c96c54f2f8dd43334b8f580af93ffaea24df \
            --audit-output "$RUNNER_TEMP/bilingual-native-audit.json"
          cmp runs/bilingual-judgment-native-main-20261001/audit.json "$RUNNER_TEMP/bilingual-native-audit.json"
          go run ./tools/package-bilingual-judgment --bundle "$RUNNER_TEMP/bilingual-judgment-bundle"
          cmp publication/hf-bilingual-gooo-judgment-20261001/publication-manifest.json "$RUNNER_TEMP/bilingual-judgment-bundle/publication-manifest.json"
          go run ./tools/package-bilingual-judgment --mode verify --bundle "$RUNNER_TEMP/bilingual-judgment-bundle" \
            --output "$RUNNER_TEMP/bilingual-publication-verification.json"
      - name: Replay separated context and intent experiment including regressions
        run: |
          go run ./tools/audit-feedback-model --models runs/split-context-judgment-mps-20261001/v1/models \
            --output "$RUNNER_TEMP/split-v1-parity.json"
          go run ./tools/audit-feedback-model --models runs/split-context-judgment-mps-20261001/v2/models \
            --output "$RUNNER_TEMP/split-v2-parity.json"
          go run ./tools/audit-bilingual-judgment --models runs/split-context-judgment-mps-20261001 --arms v1,v2 \
            --out "$RUNNER_TEMP/split-context-judgment"
          go run ./tools/package-split-context --bundle "$RUNNER_TEMP/split-context-bundle"
          cmp publication/hf-split-context-gooo-judgment-20261001/publication-manifest.json "$RUNNER_TEMP/split-context-bundle/publication-manifest.json"
          go run ./tools/package-split-context --mode verify --bundle "$RUNNER_TEMP/split-context-bundle" \
            --output "$RUNNER_TEMP/split-context-publication-verification.json"
      - name: Reconcile own-model SDK context archive without network publication
        run: |
          go run ./tools/package-family-evidence --kind own-model-sdk-context --pack --bundle "$RUNNER_TEMP/own-model-sdk-context-bundle"
          cmp publication/hf-own-model-sdk-context-20261001/publication-manifest.json "$RUNNER_TEMP/own-model-sdk-context-bundle/publication-manifest.json"
          go run ./tools/package-family-evidence --kind own-model-sdk-context --bundle "$RUNNER_TEMP/own-model-sdk-context-bundle" --output "$RUNNER_TEMP/own-model-sdk-context-verification.json"
      - name: Verify public export without credentials or network publication
        run: |
          go run ./tools/assemble-public-export --output "$RUNNER_TEMP/public-model-bundle" --allowlist "$RUNNER_TEMP/public-model-allowlist.json"
          cmp publication/public-export-allowlist-v1.json "$RUNNER_TEMP/public-model-allowlist.json"
          go run ./tools/verify-public-export "$RUNNER_TEMP/public-model-bundle" "$RUNNER_TEMP/public-model-allowlist.json" > "$RUNNER_TEMP/export-verification.json"
          cmp publication/public-export-verification-v1.json "$RUNNER_TEMP/export-verification.json"
      - name: Independent Go parity and finite held-out evaluation
        run: |
          go run ./cmd/gooo-model-audit --models runs/pilot-mps-20260930-v1/models --parity runs/pilot-mps-20260930-v1/go-parity.json --dataset data/synthetic-ops-v1/dataset.jsonl --output "$RUNNER_TEMP/go-audit-ci.json"
      - name: Reproduce compiler curriculum and verify the fixed new model bundle
        run: |
          go run ./cmd/compiler-curriculum --output "$RUNNER_TEMP/compiler-curriculum"
          cmp data/compiler-prov-v2/dataset.jsonl "$RUNNER_TEMP/compiler-curriculum/dataset.jsonl"
