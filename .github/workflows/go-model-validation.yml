name: Go model validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-and-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Require formatted Go
        run: test -z "$(gofmt -l cmd internal tools decision)"
      - name: Go vet
        run: go vet ./...
      - name: Runtime and publication regression tests
        run: go test -race ./...
      - name: Reproduce frozen synthetic data
        run: |
          go run ./cmd/dataset --out-dir "$RUNNER_TEMP/dataset-replay"
          cmp data/synthetic-ops-v1/dataset.jsonl "$RUNNER_TEMP/dataset-replay/dataset.jsonl"
          cmp data/synthetic-ops-v1/manifest.json "$RUNNER_TEMP/dataset-replay/manifest.json"
      - name: Reproduce frozen multi-node body cohort
        run: |
          go run ./studies/body-plan-v1 "$RUNNER_TEMP/body-plan-cohort"
          cmp studies/body-plan-v1/cohort.jsonl "$RUNNER_TEMP/body-plan-cohort/cohort.jsonl"
          cmp studies/body-plan-v1/manifest.json "$RUNNER_TEMP/body-plan-cohort/manifest.json"
      - name: Reproduce five-family native continuation cohort
        run: |
          go run ./tools/native-feedback-study --mode family-cohort --out "$RUNNER_TEMP/native-family-cohort"
          cmp studies/feedback-family-v1/cohort.jsonl "$RUNNER_TEMP/native-family-cohort/cohort.jsonl"
          cmp studies/feedback-family-v1/manifest.json "$RUNNER_TEMP/native-family-cohort/manifest.json"
      - name: Reproduce interacting four-path body cohort
        run: |
          go run ./tools/native-feedback-study --mode compound-cohort --out "$RUNNER_TEMP/compound-path-cohort"
          cmp studies/compound-path-v1/cohort.jsonl "$RUNNER_TEMP/compound-path-cohort/cohort.jsonl"
          cmp studies/compound-path-v1/manifest.json "$RUNNER_TEMP/compound-path-cohort/manifest.json"
      - name: Reproduce finite feedback targets with preserved ambiguity
        run: |
          go run ./cmd/feedback-curriculum --out "$RUNNER_TEMP/feedback-path-curriculum"
          cmp data/feedback-path-v1/dataset.jsonl "$RUNNER_TEMP/feedback-path-curriculum/dataset.jsonl"
          cmp data/feedback-path-v1/manifest.json "$RUNNER_TEMP/feedback-path-curriculum/manifest.json"
      - name: Verify feedback-trained model pairs and numerical parity
        run: |
          go run ./tools/audit-feedback-model --models runs/feedback-path-soft-target-mps-20261001/models \
            --output "$RUNNER_TEMP/feedback-path-model-audit.json"
      - name: Reproduce source-bound bilingual Gooo pairs
        run: |
          go run ./cmd/bilingual-pairs --out "$RUNNER_TEMP/bilingual-gooo-pairs"
          cmp data/bilingual-gooo-pairs-v1/pairs.jsonl "$RUNNER_TEMP/bilingual-gooo-pairs/pairs.jsonl"
          cmp data/bilingual-gooo-pairs-v1/manifest.json "$RUNNER_TEMP/bilingual-gooo-pairs/manifest.json"
      - name: Verify both bilingual judgment arms and finite continuation
        run: |
          go run ./tools/audit-feedback-model --models runs/bilingual-judgment-mps-20261001/control/models \
            --output "$RUNNER_TEMP/bilingual-control-go-parity.json"
          go run ./tools/audit-feedback-model --models runs/bilingual-judgment-mps-20261001/paired/models \
            --output "$RUNNER_TEMP/bilingual-paired-go-parity.json"
          go run ./tools/audit-bilingual-judgment --models runs/bilingual-judgment-mps-20261001 \
            --out "$RUNNER_TEMP/bilingual-go-judgment"
      - name: Reconcile captured bilingual main dogfood and publication
        run: |
          go run ./tools/native-feedback-study --mode bilingual-audit --out runs/bilingual-judgment-native-main-20261001 \
            --source-revision 90dbefe731cb95a65798ef6d380f22cfd811b5ca \
            --native-revision 1e01c96c54f2f8dd43334b8f580af93ffaea24df \
            --audit-output "$RUNNER_TEMP/bilingual-native-audit.json"
          cmp runs/bilingual-judgment-native-main-20261001/audit.json "$RUNNER_TEMP/bilingual-native-audit.json"
          go run ./tools/package-bilingual-judgment --bundle "$RUNNER_TEMP/bilingual-judgment-bundle"
          cmp publication/hf-bilingual-gooo-judgment-20261001/publication-manifest.json "$RUNNER_TEMP/bilingual-judgment-bundle/publication-manifest.json"
          go run ./tools/package-bilingual-judgment --mode verify --bundle "$RUNNER_TEMP/bilingual-judgment-bundle" \
            --output "$RUNNER_TEMP/bilingual-publication-verification.json"
      - name: Replay separated context and intent experiment including regressions
        run: |
          go run ./tools/audit-feedback-model --models runs/split-context-judgment-mps-20261001/v1/models \
            --output "$RUNNER_TEMP/split-v1-parity.json"
          go run ./tools/audit-feedback-model --models runs/split-context-judgment-mps-20261001/v2/models \
            --output "$RUNNER_TEMP/split-v2-parity.json"
          go run ./tools/audit-bilingual-judgment --models runs/split-context-judgment-mps-20261001 --arms v1,v2 \
            --out "$RUNNER_TEMP/split-context-judgment"
          go run ./tools/package-split-context --bundle "$RUNNER_TEMP/split-context-bundle"
          cmp publication/hf-split-context-gooo-judgment-20261001/publication-manifest.json "$RUNNER_TEMP/split-context-bundle/publication-manifest.json"
          go run ./tools/package-split-context --mode verify --bundle "$RUNNER_TEMP/split-context-bundle" \
            --output "$RUNNER_TEMP/split-context-publication-verification.json"
      - name: Verify public export without credentials or network publication
        run: |
          go run ./tools/assemble-public-export --output "$RUNNER_TEMP/public-model-bundle" --allowlist "$RUNNER_TEMP/public-model-allowlist.json"
          cmp publication/public-export-allowlist-v1.json "$RUNNER_TEMP/public-model-allowlist.json"
          go run ./tools/verify-public-export "$RUNNER_TEMP/public-model-bundle" "$RUNNER_TEMP/public-model-allowlist.json" > "$RUNNER_TEMP/export-verification.json"
          cmp publication/public-export-verification-v1.json "$RUNNER_TEMP/export-verification.json"
      - name: Independent Go parity and finite held-out evaluation
        run: |
          go run ./cmd/gooo-model-audit --models runs/pilot-mps-20260930-v1/models --parity runs/pilot-mps-20260930-v1/go-parity.json --dataset data/synthetic-ops-v1/dataset.jsonl --output "$RUNNER_TEMP/go-audit-ci.json"
      - name: Reproduce compiler curriculum and verify the fixed new model bundle
        run: |
          go run ./cmd/compiler-curriculum --output "$RUNNER_TEMP/compiler-curriculum"
          cmp data/compiler-prov-v2/dataset.jsonl "$RUNNER_TEMP/compiler-curriculum/dataset.jsonl"
          cmp data/compiler-prov-v2/manifest.json "$RUNNER_TEMP/compiler-curriculum/manifest.json"
          cmp data/compiler-prov-v2/repair-regressions.json "$RUNNER_TEMP/compiler-curriculum/repair-regressions.json"
          go run ./tools/package-compiler-model --output "$RUNNER_TEMP/compiler-model-bundle"
          cmp publication/hf-compiler-prov-v2/publication-manifest.json "$RUNNER_TEMP/compiler-model-bundle/publication-manifest.json"
          go run ./tools/verify-compiler-model --bundle "$RUNNER_TEMP/compiler-model-bundle" --output "$RUNNER_TEMP/compiler-bundle-verification.json"
          go run ./cmd/gooo-model-audit --models runs/compiler-prov-v3-mps-20261001/models --parity runs/compiler-prov-v3-mps-20261001/go-parity.json --dataset data/compiler-prov-v2/dataset.jsonl --expected-rows 6146 --expected-test-rows 768 --output "$RUNNER_TEMP/compiler-go-audit-ci.json"
      - name: Exercise bounded Go stream end to end
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/gooo-decision-stream-ci" ./cmd/gooo-decision-stream
          task_stream_sha=$(sha256sum "$RUNNER_TEMP/gooo-decision-stream-ci" | cut -d ' ' -f 1)
          go run ./tools/benchmark-stream --stream-bin "$RUNNER_TEMP/gooo-decision-stream-ci" --binary-sha256 "$task_stream_sha" --output "$RUNNER_TEMP/stream-end-to-end-ci.json"
      - name: Replay bilingual structural data, numerical parity and bounded TDD
        run: |
          go run ./cmd/path-curriculum --out "$RUNNER_TEMP/path-curriculum"
          cmp data/typed-path-v1/dataset.jsonl "$RUNNER_TEMP/path-curriculum/dataset.jsonl"
          go run ./tools/audit-path-model --dataset data/typed-path-v1/dataset.jsonl --models runs/typed-path-v1-mps-20261001-v2/models --parity runs/typed-path-v1-mps-20261001-v2/go-parity.json --output "$RUNNER_TEMP/path-uniform-audit"
          go run ./tools/audit-path-model --dataset data/typed-path-positioned-v2/dataset.jsonl --models runs/typed-path-positioned-transfer-20261001/models --parity runs/typed-path-positioned-transfer-20261001/go-parity.json --output "$RUNNER_TEMP/path-positioned-transfer-audit"
          go run ./tools/audit-path-model --dataset data/typed-path-positioned-v2/dataset.jsonl --models runs/typed-path-positioned-random-20261001/models --parity runs/typed-path-positioned-random-20261001/go-parity.json --output "$RUNNER_TEMP/path-positioned-random-audit"
          go run ./tools/audit-path-search --models runs/typed-path-positioned-random-20261001/models --output "$RUNNER_TEMP/path-reserved-probe-tdd" --source-revision "$GITHUB_SHA"
      - name: Verify fixed structural HF bundle locally
        run: |
          go run ./tools/package-path-model --output "$RUNNER_TEMP/path-model-bundle"
          cmp publication/hf-typed-path-v1/publication-manifest.json "$RUNNER_TEMP/path-model-bundle/publication-manifest.json"
          go run ./tools/package-path-model --mode verify --bundle "$RUNNER_TEMP/path-model-bundle" --output "$RUNNER_TEMP/path-model-bundle-verification.json"
          go run ./tools/package-path-model --native-review --output "$RUNNER_TEMP/path-model-reviewed-bundle"
          cmp publication/hf-typed-path-v1-reviewed/publication-manifest.json "$RUNNER_TEMP/path-model-reviewed-bundle/publication-manifest.json"
          go run ./tools/package-path-model --mode verify --bundle "$RUNNER_TEMP/path-model-reviewed-bundle" --output "$RUNNER_TEMP/path-model-reviewed-verification.json"
          go run ./tools/package-path-model --native-direct --output "$RUNNER_TEMP/path-model-direct-bundle"
          cmp publication/hf-typed-path-v1-native-direct/publication-manifest.json "$RUNNER_TEMP/path-model-direct-bundle/publication-manifest.json"
          go run ./tools/package-path-model --mode verify --bundle "$RUNNER_TEMP/path-model-direct-bundle" --output "$RUNNER_TEMP/path-model-direct-verification.json"
          go run ./tools/package-path-model --main-promotion --output "$RUNNER_TEMP/path-model-main-bundle"
          cmp publication/hf-typed-path-v1-native-main/publication-manifest.json "$RUNNER_TEMP/path-model-main-bundle/publication-manifest.json"
          go run ./tools/package-path-model --mode verify --bundle "$RUNNER_TEMP/path-model-main-bundle" --output "$RUNNER_TEMP/path-model-main-verification.json"
          go run ./tools/package-path-model --prepared-native --output "$RUNNER_TEMP/path-model-prepared-bundle"
          cmp publication/hf-typed-path-v1-prepared-native/publication-manifest.json "$RUNNER_TEMP/path-model-prepared-bundle/publication-manifest.json"
          go run ./tools/package-path-model --mode verify --bundle "$RUNNER_TEMP/path-model-prepared-bundle" --output "$RUNNER_TEMP/path-model-prepared-verification.json"
          go run ./tools/package-path-model --incremental-native --output "$RUNNER_TEMP/path-model-incremental-bundle"
          cmp publication/hf-typed-path-v1-incremental-native/publication-manifest.json "$RUNNER_TEMP/path-model-incremental-bundle/publication-manifest.json"
          go run ./tools/package-path-model --mode verify --bundle "$RUNNER_TEMP/path-model-incremental-bundle" --output "$RUNNER_TEMP/path-model-incremental-verification.json"
      - name: Audit captured feedback and reproduce its synthetic appendix
        run: |
          go run ./tools/audit-feedback-pilot --output "$RUNNER_TEMP/feedback-pilot-audit.json"
          cmp runs/feedback-path-pilot-fixed-20261001/audit.json "$RUNNER_TEMP/feedback-pilot-audit.json"
          go run ./tools/package-feedback-pilot --bundle "$RUNNER_TEMP/feedback-pilot-bundle"
          cmp publication/hf-feedback-path-pilot-20261001/publication-manifest.json "$RUNNER_TEMP/feedback-pilot-bundle/publication-manifest.json"
          go run ./tools/package-feedback-pilot --mode verify --bundle "$RUNNER_TEMP/feedback-pilot-bundle" --output "$RUNNER_TEMP/feedback-pilot-verification.json"
      - name: Audit captured native feedback and actual generated Go
        run: |
          go run ./tools/native-feedback-study --mode audit --native-root studies/native-feedback-v1 \
            --out runs/native-feedback-integration-fixed-20261001 \
            --audit-output "$RUNNER_TEMP/native-feedback-audit.json"
          cmp runs/native-feedback-integration-fixed-20261001/audit.json "$RUNNER_TEMP/native-feedback-audit.json"
          go run ./tools/package-native-feedback --bundle "$RUNNER_TEMP/native-feedback-bundle"
          cmp publication/hf-native-feedback-20261001/publication-manifest.json "$RUNNER_TEMP/native-feedback-bundle/publication-manifest.json"
          go run ./tools/package-native-feedback --mode verify --bundle "$RUNNER_TEMP/native-feedback-bundle" \
            --output "$RUNNER_TEMP/native-feedback-verification.json"
      - name: Audit continued construction after a zero-call context decline
        run: |
          go run ./tools/native-feedback-study --mode continued-audit \
            --out runs/feedback-context-decline-20261001 \
            --audit-output "$RUNNER_TEMP/continued-judgment-audit.json"
          cmp runs/feedback-context-decline-20261001/audit.json "$RUNNER_TEMP/continued-judgment-audit.json"
          go run ./tools/package-continued-judgment --bundle "$RUNNER_TEMP/continued-judgment-bundle"
          cmp publication/hf-continued-judgment-20261001/publication-manifest.json "$RUNNER_TEMP/continued-judgment-bundle/publication-manifest.json"
          go run ./tools/package-continued-judgment --mode verify --bundle "$RUNNER_TEMP/continued-judgment-bundle" \
            --output "$RUNNER_TEMP/continued-judgment-verification.json"
      - name: Audit actual feedback-trained native bodies in both source editions
        run: |
          go run ./tools/native-feedback-study --mode trained-audit \
            --out runs/feedback-trained-native-20261001 --audit-output "$RUNNER_TEMP/trained-native-audit.json"
          cmp runs/feedback-trained-native-20261001/audit.json "$RUNNER_TEMP/trained-native-audit.json"
          go run ./tools/native-feedback-study --mode trained-audit \
            --out runs/feedback-trained-main-smokes-20261001 --audit-output "$RUNNER_TEMP/trained-main-audit.json"
          cmp runs/feedback-trained-main-smokes-20261001/audit.json "$RUNNER_TEMP/trained-main-audit.json"
          go run ./tools/native-feedback-study --mode continued-audit \
            --out runs/feedback-decline-main-smokes-20261001 --audit-output "$RUNNER_TEMP/decline-main-audit.json"
          cmp runs/feedback-decline-main-smokes-20261001/audit.json "$RUNNER_TEMP/decline-main-audit.json"
      - name: Reproduce allowlisted feedback model publication locally
        run: |
          go run ./tools/package-feedback-model --bundle "$RUNNER_TEMP/feedback-model-bundle"
          cmp publication/hf-feedback-path-tiny-v1-20261001/publication-manifest.json "$RUNNER_TEMP/feedback-model-bundle/publication-manifest.json"
          go run ./tools/package-feedback-model --mode verify --bundle "$RUNNER_TEMP/feedback-model-bundle" \
            --output "$RUNNER_TEMP/feedback-model-verification.json"
      - name: Replay recorded partial-completeness curves without inference
        run: |
          go run ./tools/continuation-metrics --output "$RUNNER_TEMP/feedback-continuation-curves.json"
          cmp publication/feedback-continuation-curves-20261001.json "$RUNNER_TEMP/feedback-continuation-curves.json"
          go run ./tools/family-metrics --output "$RUNNER_TEMP/native-family-descriptive-metrics.json"
          cmp publication/native-family-descriptive-metrics-20261001.json "$RUNNER_TEMP/native-family-descriptive-metrics.json"
          go run ./tools/unfixed-metrics --output "$RUNNER_TEMP/unfixed-feedback-descriptive-metrics.json"
          cmp publication/unfixed-feedback-descriptive-metrics-20261001.json "$RUNNER_TEMP/unfixed-feedback-descriptive-metrics.json"
      - name: Audit captured five-family native generation and independent Go
        run: |
          go run ./tools/native-feedback-study --mode family-audit --out runs/feedback-family-pilot-20261001 \
            --audit-output "$RUNNER_TEMP/family-pilot-audit.json"
          cmp runs/feedback-family-pilot-20261001/audit.json "$RUNNER_TEMP/family-pilot-audit.json"
          go run ./tools/native-feedback-study --mode family-audit --out runs/feedback-family-matrix-20261001 \
            --audit-output "$RUNNER_TEMP/family-matrix-audit.json"
          cmp runs/feedback-family-matrix-20261001/audit.json "$RUNNER_TEMP/family-matrix-audit.json"
          go run ./tools/native-feedback-study --mode family-audit --out runs/feedback-family-optimized-feature-20261001 \
            --audit-output "$RUNNER_TEMP/family-optimized-feature-audit.json"
          cmp runs/feedback-family-optimized-feature-20261001/audit.json "$RUNNER_TEMP/family-optimized-feature-audit.json"
          go run ./tools/native-feedback-study --mode family-audit --out runs/feedback-family-optimized-main-20261001 \
            --audit-output "$RUNNER_TEMP/family-optimized-main-audit.json"
          cmp runs/feedback-family-optimized-main-20261001/audit.json "$RUNNER_TEMP/family-optimized-main-audit.json"
          go run ./tools/native-feedback-study --mode compound-audit --out runs/compound-path-pilot-20261001 \
            --audit-output "$RUNNER_TEMP/compound-pilot-audit.json"
          cmp runs/compound-path-pilot-20261001/audit.json "$RUNNER_TEMP/compound-pilot-audit.json"
          go run ./tools/native-feedback-study --mode compound-audit --out runs/compound-path-main-20261001 \
            --audit-output "$RUNNER_TEMP/compound-main-audit.json"
          cmp runs/compound-path-main-20261001/audit.json "$RUNNER_TEMP/compound-main-audit.json"
          go run ./tools/native-feedback-study --mode unfixed-audit --out runs/unfixed-feedback-sdk-20261001 \
            --source-revision e5d115f79944765d7a675f2f99664d556333ef2a \
            --audit-output "$RUNNER_TEMP/unfixed-feedback-sdk-audit.json"
          cmp runs/unfixed-feedback-sdk-20261001/report.json "$RUNNER_TEMP/unfixed-feedback-sdk-audit.json"
          go run ./tools/native-feedback-study --mode native-unfixed-audit \
            --out runs/unfixed-native-feature-pilot-20261001 \
            --source-revision 3749fdc6c1f218c36d944a7899bb1125061c6906 \
            --native-revision d869be3219a7798b6cc3b13c31efa8a6d899ae22 \
            --audit-output "$RUNNER_TEMP/unfixed-native-feature-audit.json"
          cmp runs/unfixed-native-feature-pilot-20261001/report.json "$RUNNER_TEMP/unfixed-native-feature-audit.json"
          go run ./tools/native-unfixed-metrics --output "$RUNNER_TEMP/unfixed-native-feature-metrics.json"
          cmp publication/unfixed-native-feature-descriptive-metrics-20261001.json "$RUNNER_TEMP/unfixed-native-feature-metrics.json"
          go run ./tools/native-feedback-study --mode native-unfixed-audit \
            --out runs/unfixed-native-main-pilot-20261001 \
            --source-revision b093d1b7a855dba34051b0b4ff959ba8be45fdf0 \
            --native-revision 6f69eb116336b4728db6f94a992130ea56003a48 \
            --audit-output "$RUNNER_TEMP/unfixed-native-main-audit.json"
          cmp runs/unfixed-native-main-pilot-20261001/report.json "$RUNNER_TEMP/unfixed-native-main-audit.json"
          go run ./tools/native-unfixed-metrics --root runs/unfixed-native-main-pilot-20261001 \
            --output "$RUNNER_TEMP/unfixed-native-main-metrics.json"
          cmp publication/unfixed-native-main-descriptive-metrics-20261001.json "$RUNNER_TEMP/unfixed-native-main-metrics.json"
      - name: Replay retained native construction and costs without inference
        run: |
          go run ./tools/native-feedback-study --mode retained-audit \
            --out runs/retained-native-feature-pilot-20261001 \
            --source-revision be3ccb633446ef4379af964007f8d25766d6726b \
            --native-revision faf932f85c6acc293ce3839a563665661cb53665 \
            --audit-output "$RUNNER_TEMP/retained-native-audit.json"
          cmp runs/retained-native-feature-pilot-20261001/report.json "$RUNNER_TEMP/retained-native-audit.json"
          go run ./tools/native-feedback-study --mode budget-audit \
            --out runs/native-budget-main-20261001 \
            --source-revision ab8e19b26e2298e713888a64e59602dc5c383529 \
            --native-revision 37fb287a9c888bd0262194f524dde16426eca3a9 \
            --audit-output "$RUNNER_TEMP/native-budget-audit.json"
          cmp runs/native-budget-main-20261001/report.json "$RUNNER_TEMP/native-budget-audit.json"
          go run ./tools/package-family-evidence --kind native-budget-main --pack \
            --bundle "$RUNNER_TEMP/native-budget-bundle"
          cmp publication/hf-native-budget-main-20261001/publication-manifest.json "$RUNNER_TEMP/native-budget-bundle/publication-manifest.json"
          go run ./tools/package-family-evidence --kind native-budget-main \
            --bundle "$RUNNER_TEMP/native-budget-bundle" \
            --output "$RUNNER_TEMP/native-budget-verification.json"
          go run ./tools/native-feedback-study --mode diagnosis-audit \
            --out runs/path-diagnosis-sdk-20261001 \
            --source-revision a2b7c0c6960888d93f408f0f45af698c579d68cf \
            --audit-output "$RUNNER_TEMP/path-diagnosis-audit.json"
          cmp runs/path-diagnosis-sdk-20261001/report.json "$RUNNER_TEMP/path-diagnosis-audit.json"
          go run ./tools/package-family-evidence --kind path-diagnosis-sdk --pack \
            --bundle "$RUNNER_TEMP/path-diagnosis-bundle"
          cmp publication/hf-path-diagnosis-sdk-20261001/publication-manifest.json "$RUNNER_TEMP/path-diagnosis-bundle/publication-manifest.json"
          go run ./tools/package-family-evidence --kind path-diagnosis-sdk \
            --bundle "$RUNNER_TEMP/path-diagnosis-bundle" \
            --output "$RUNNER_TEMP/path-diagnosis-verification.json"
          go run ./tools/native-feedback-study --mode native-diagnosis-audit \
            --out runs/native-path-diagnosis-feature-20261001 \
            --source-revision 18ae830c18b47b377ae8fa97dcc39df75f6b593b \
            --native-revision 5ae486d05b3521ecc48b18bfa28d45cdd9041203 \
            --audit-output "$RUNNER_TEMP/native-path-diagnosis-audit.json"
          cmp runs/native-path-diagnosis-feature-20261001/report.json "$RUNNER_TEMP/native-path-diagnosis-audit.json"
          go run ./tools/package-family-evidence --kind native-path-diagnosis-feature --pack \
            --bundle "$RUNNER_TEMP/native-path-diagnosis-bundle"
          cmp publication/hf-native-path-diagnosis-feature-20261001/publication-manifest.json "$RUNNER_TEMP/native-path-diagnosis-bundle/publication-manifest.json"
          go run ./tools/package-family-evidence --kind native-path-diagnosis-feature \
            --bundle "$RUNNER_TEMP/native-path-diagnosis-bundle" \
            --output "$RUNNER_TEMP/native-path-diagnosis-verification.json"
          go run ./tools/native-feedback-study --mode retained-metrics \
            --out runs/retained-native-feature-pilot-20261001 \
            --audit-output "$RUNNER_TEMP/retained-native-metrics.json"
          cmp runs/retained-native-feature-pilot-20261001/metrics-summary.json "$RUNNER_TEMP/retained-native-metrics.json"
          go run ./tools/native-feedback-study --mode retained-completeness \
            --out runs/retained-native-feature-pilot-20261001 \
            --audit-output "$RUNNER_TEMP/retained-completeness.json"
          cmp runs/retained-native-feature-pilot-20261001/completeness-summary.json "$RUNNER_TEMP/retained-completeness.json"
          go run ./tools/package-family-evidence --kind retained-completeness --pack \
            --bundle "$RUNNER_TEMP/retained-completeness-bundle"
          cmp publication/hf-retained-native-completeness-20261001/publication-manifest.json "$RUNNER_TEMP/retained-completeness-bundle/publication-manifest.json"
